<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF4FA">
<script id="theme0">
// тема ставится до отрисовки, чтобы не мигало: «Рамунэ» (светлая) или «Ночное бенто» (тёмная)
(function () { try {
  var t = (JSON.parse(localStorage.getItem('jp_settings') || '{}') || {}).theme || 'auto';
  var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
} catch (e) {} })();
</script>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=M+PLUS+1p:wght@500;700;800&display=swap">
<link rel="stylesheet" href="yuki.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Частицы</title>
<style>
/* ===== Палитры: «Рамунэ» (светлая) и «Ночное бенто» (тёмная). Цвета только через эти переменные. ===== */
:root{
  --jp:"M PLUS 1p","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  --ui:"Inter",system-ui,-apple-system,"Noto Sans",Roboto,sans-serif;
  --bg:#EEF4FA;--card:#FFFFFF;--ink:#1F2A3A;--mute:#627086;--line:#E1E8F0;--grid:#BCD0E6;--soft:rgba(31,42,58,.08);--off:rgba(98,112,134,.35);
  --yk:#D3EAFA;--t1:#FFF0BF;--t2:#E3E0FB;--t3:#D8F3E9;--t4:#FCE3E4;
  --acc:#2B74EE;--acc2:#F5B820;--onacc:#FFFFFF;--tint:rgba(43,116,238,.10);
  --good:#1FA971;--ongood:#FFFFFF;--bad:#E5484D;--onbad:#FFFFFF;
  --nav:#1F2A3A;--navon:#FFFFFF;--navoff:#8A95A8;--pill:rgba(255,255,255,.14);--chip:#1F2A3A;--chipink:#FFFFFF;
  --shadow:0 1px 2px rgba(31,42,58,.05),0 6px 18px rgba(31,42,58,.06);
  --cell:38px;--spring:cubic-bezier(.3,1.6,.5,1);
  color-scheme:light
}
:root[data-theme=dark]{
  --bg:#141519;--card:#22242B;--ink:#EDEDF2;--mute:#9496A3;--line:#30323A;--grid:#3B4650;--soft:rgba(237,237,242,.08);--off:rgba(148,150,163,.35);
  --yk:#1D3A37;--t1:#2E2744;--t2:#3A2830;--t3:#1F3040;--t4:#3A2226;
  --acc:#3ED3C3;--acc2:#B49BFF;--onacc:#0E1514;--tint:rgba(62,211,195,.12);
  --good:#3ED3A0;--ongood:#0E1514;--bad:#FF6B6B;--onbad:#1A0E0E;
  --nav:#22242B;--navon:#3ED3C3;--navoff:#7D7F8C;--pill:rgba(62,211,195,.14);--chip:#EDEDF2;--chipink:#141519;
  --shadow:none;
  color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);transition:background-color .35s,color .35s}
html.theming *{transition:background-color .35s,color .35s,border-color .35s,box-shadow .35s!important}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:16px 14px calc(110px + env(safe-area-inset-bottom))}
h1{font:800 26px/1.2 var(--ui);margin:4px 4px 14px;letter-spacing:-.01em}
h2{font:800 20px/1.25 var(--ui);margin:4px 4px 12px}
h3{font:700 14px var(--ui);margin:18px 4px 8px;color:var(--mute)}
.card h3{margin:0 0 6px;color:var(--ink);font-size:16px}
b{font-weight:700}
[lang=ja]{font-family:var(--jp)}
.seal{display:inline-block;font:800 .72rem/1 var(--jp);color:#fff;background:var(--bad);padding:3px 4px;border-radius:4px;transform:rotate(-6deg);margin-left:6px;vertical-align:1px}
.small{font-size:.88rem;color:var(--mute);margin-top:4px}
.note{background:var(--tint);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:.92rem}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}

/* ===== Бенто на главном ===== */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);border-radius:22px;padding:14px;position:relative;overflow:hidden;box-shadow:var(--shadow);min-width:0;font:inherit;transition:transform .35s var(--spring)}
button.t{cursor:pointer}
button.t:active{transform:scale(.965);transition:transform .1s}
.t.c1{background:var(--t1)}.t.c2{background:var(--t2)}.t.c3{background:var(--t3)}.t.c4{background:var(--t4)}
.t.wide{grid-column:span 2;display:flex;align-items:center;gap:12px}
.t .i{width:44px;height:44px;border-radius:14px;background:var(--chip);color:var(--chipink);font:800 22px/1 var(--jp);display:grid;place-items:center;flex:0 0 auto}
.t b{display:block;font-size:15px;margin-top:8px}.t.wide b{margin-top:0}
.t .ts{display:block;font-size:12px;color:var(--mute)}
.t .tx{flex:1;min-width:0}
.t .rt2{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.lab{font-size:12px;color:var(--mute)}
.num{font:800 28px/1.15 var(--ui);font-variant-numeric:tabular-nums}
.t.yk{grid-row:span 2;background:var(--yk);padding:12px 8px 0;display:flex;flex-direction:column}
.t.yk .say{font-size:13px;font-weight:600;padding:0 4px;min-height:36px;transition:opacity .18s}
.t.yk .yuki{width:132px;margin:auto auto 0}
.tbar{display:block;height:6px;border-radius:6px;background:var(--soft);margin-top:8px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width 1s cubic-bezier(.3,.9,.3,1) .35s}
/* кольцо цели дня */
.ring{position:relative;width:92px;height:92px;margin:0 auto 4px}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bgc{stroke:var(--soft)}
.ring .fg{stroke:var(--acc);stroke-dasharray:226.2;transition:stroke-dashoffset 1.1s cubic-bezier(.3,.9,.3,1),stroke .35s}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font:800 19px var(--ui);font-variant-numeric:tabular-nums}
.ring.done .fg{stroke:var(--good)}
.ring.burst:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--good);animation:burst .8s ease-out forwards}
/* серия: две недели клеточками */
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.mcal i{aspect-ratio:1;border-radius:4px;background:var(--soft)}
.mcal i.f{background:var(--acc)}.mcal i.today{background:var(--acc2)}
.in .mcal i.f,.in .mcal i.today{animation:cellIn .35s var(--spring) backwards;animation-delay:calc(420ms + var(--c,0) * 45ms)}
.mcal i.stamp{animation:stampCal .5s var(--spring) both}

/* вход экрана: карточки появляются лесенкой */
.in .st{animation:tileIn .55s cubic-bezier(.2,.9,.3,1.18) backwards;animation-delay:calc(var(--i,0) * 55ms)}

/* ===== нижнее меню: «пилюля» переезжает к активной вкладке ===== */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(532px,calc(100% - 28px));display:flex;background:var(--nav);border-radius:24px;padding:6px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#tabs .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:18px;background:var(--pill);transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
#tabs button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;border:0;background:none;color:var(--navoff);font:600 11px var(--ui);padding:6px 2px 5px;transition:color .25s;cursor:pointer}
#tabs b{display:block;font:500 19px/1.25 var(--jp)}
#tabs button.on{color:var(--navon)}

/* ===== верх раздела: назад + полоска цели дня ===== */
.top{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.top h2{margin:0}
.bk{flex:0 0 auto;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);font:800 22px/1 var(--ui);color:var(--ink);cursor:pointer;transition:transform .1s}
.bk:active{transform:scale(.92)}
.sess{flex:1;height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.sess i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.sess.done i{background:var(--good)}
.sn{font:700 13px var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap}

/* переключатель с «бегунком» */
.seg{display:flex;position:relative;background:var(--card);border-radius:14px;padding:3px;margin:0 0 12px;box-shadow:var(--shadow)}
.card .seg{background:var(--bg);box-shadow:none;margin:10px 0 0}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));border-radius:11px;background:var(--acc);transform:translateX(calc(var(--k) * 100%));transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.seg button{flex:1;position:relative;z-index:1;min-height:40px;border:0;background:none;border-radius:11px;font:700 14px var(--ui);color:var(--mute);transition:color .25s;cursor:pointer;padding:0 4px}
.seg button.on{color:var(--onacc)}
.seg button:disabled{opacity:.4}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tog{flex:0 0 auto;width:52px;height:32px;border-radius:16px;border:0;background:var(--off);position:relative;cursor:pointer;transition:background .25s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.tog.on{background:var(--acc)}.tog.on:after{transform:translateX(20px)}

/* кнопки и поля */
.primary,.ghost,.danger{display:block;width:100%;min-height:52px;border-radius:16px;border:0;font:800 16px var(--ui);margin-top:12px;cursor:pointer;transition:transform .1s}
.primary{background:var(--acc);color:var(--onacc)}
.primary:not(:disabled):active,.ghost:active,.danger:active{transform:scale(.98)}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:var(--bg);color:var(--ink);margin-top:10px}
.danger{background:var(--t4);color:var(--bad)}
.link{background:none;border:0;color:var(--acc);padding:8px 0 0;font:700 .9rem var(--ui);cursor:pointer}
.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px}
textarea,input[type=text],select{width:100%;background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:11px 12px;font:inherit;margin:4px 0 12px;outline:0;transition:border-color .2s}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--acc)}
label{font-size:.85rem;color:var(--mute)}
.row{display:flex;gap:10px}.row>div{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.chip{border-radius:12px;padding:6px 10px;background:var(--bg);font-size:13px;color:var(--mute)}
.chip b{color:var(--ink);font:800 17px var(--jp);margin-right:2px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.sent{font:700 1.2rem/1.6 var(--jp)}
.sent .fill{color:var(--good);font-weight:800}

/* ===== лист с предложением (рукописная сетка) ===== */
.sheet{background:var(--card);border-radius:24px;padding:20px 16px 14px;margin-bottom:10px;box-shadow:var(--shadow);transition:box-shadow .4s}
.sheet.okg{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 55%,transparent)}
.sheet.badg{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 55%,transparent)}
.grid{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:6px;padding:2px}
.u{display:flex;flex-direction:column;align-items:flex-start;flex:0 0 auto;max-width:100%}
.cs{display:flex;flex-wrap:wrap;justify-content:flex-start}
.c{position:relative;display:grid;place-items:center;width:var(--cell);height:var(--cell);border:1px solid var(--grid);margin:0 -1px -1px 0;font-size:calc(var(--cell)*.6);font-weight:500;line-height:1;color:var(--ink)}
.c.blank{border:2px dashed var(--acc);background:var(--tint);z-index:1;border-radius:7px;animation:breathe 2.2s ease-in-out infinite}
.c.fill{border:2px solid var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);font-weight:800;z-index:1;border-radius:7px}
.c.fill.pop{animation:stampIn .45s cubic-bezier(.3,1.7,.5,1) both}
.c.fill.late{animation-delay:.5s}
.c.wide{width:auto;min-width:var(--cell);padding:0 5px;font-size:calc(var(--cell)*.5)}
.rt{display:flex;justify-content:center;font-size:11px;line-height:1.15;color:var(--mute);padding-bottom:2px;white-space:nowrap}
.rt .pen{color:var(--bad);font-size:14px;font-weight:700;text-decoration:line-through;text-decoration-thickness:2px;animation:fade .25s ease-out}
.read{font-family:var(--jp);font-size:1rem;color:var(--mute);margin-top:10px}
.ru{margin-top:12px;color:var(--mute)}

/* подсказка от Юки */
.hintc{display:flex;align-items:flex-end;gap:10px;width:100%;text-align:left;border:0;background:var(--yk);color:var(--ink);padding:8px 14px 0;font:inherit;border-radius:22px;margin-bottom:10px;min-height:64px}
button.hintc{cursor:pointer}
button.hintc:active{transform:scale(.98)}
.hintc .yuki{width:50px}
.hintc .hx{flex:1;font-size:13px;font-weight:600;padding-bottom:12px}
.hintc .note{background:none;padding:0;margin:0;font-weight:500}

/* кнопки частиц */
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;border-radius:16px;border:0;background:var(--card);color:var(--ink);font:800 23px/1 var(--jp);box-shadow:var(--shadow);cursor:pointer;transition:transform .3s var(--spring),background .2s,color .2s,opacity .2s}
.key:not(:disabled):active{transform:scale(.92);transition:transform .08s}
.key.w2{grid-column:span 2}
.key.ok{background:var(--good);color:var(--ongood)}
.key.no{background:var(--bad);color:var(--onbad)}
.key.dim{opacity:.4}
.key:disabled{cursor:default}
.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.shk{animation:shake .45s ease}
.late{animation-delay:.4s}

/* ===== карточка результата: выезжает снизу ===== */
.res{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:72vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.res:before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.res.up{animation:sheetUp .5s cubic-bezier(.2,1.05,.3,1) .42s both}
.res.no.up{animation-delay:.7s}
.res .card{background:var(--bg);box-shadow:none}
.mini{display:flex;align-items:flex-end;gap:12px}
.mini .yuki{width:58px}
.verdict{font:800 20px var(--ui);padding-bottom:8px}
.res.ok .verdict{color:var(--good)}
.res.no .verdict{color:var(--bad)}
.rule{margin:10px 0 6px}
.goalmsg{margin-top:10px;font-size:.9rem;color:var(--mute)}

/* ===== слова, глаголы, сборка ===== */
.kicker{font-size:.8rem;color:var(--mute);text-align:center}
.big{font:800 2.6rem/1.25 var(--jp);text-align:center;margin:6px 0 2px;word-break:keep-all}
.sub{font-family:var(--jp);text-align:center;color:var(--mute);min-height:1.5em}
.sub2{text-align:center;font-size:.85rem;color:var(--mute);margin-top:4px}
.sheet .links.lc{justify-content:center}
.task{font:800 1.2rem/1.35 var(--ui);text-align:center;margin-top:4px}
.choices{display:grid;gap:8px}
.choice{min-height:54px;border-radius:16px;border:0;background:var(--card);color:var(--ink);font:600 15px var(--ui);text-align:left;padding:10px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s var(--spring),background .2s,color .2s,opacity .2s}
.choice:not(:disabled):active{transform:scale(.97);transition:transform .08s}
.choice:disabled{cursor:default}
.choice.right{background:var(--good);color:var(--ongood)}
.choice.wrong{background:var(--bad);color:var(--onbad);text-decoration:line-through}
.choice.dim{opacity:.45}
.slot{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:74px;padding:10px;border:2px dashed var(--grid);border-radius:20px;background:var(--card);margin-bottom:12px}
.slot:empty:before{content:"Нажимай на плитки по порядку";color:var(--mute);font-size:.88rem;align-self:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.tl{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:50px;min-width:46px;padding:4px 12px 7px;border-radius:14px;border:0;background:var(--card);color:var(--ink);font:700 1.25rem/1.2 var(--jp);box-shadow:var(--shadow);cursor:pointer;transition:transform .25s var(--spring)}
.tl:active{transform:scale(.92)}
.tl small{font-size:.6rem;line-height:1.2;color:var(--mute);font-weight:500}
.slot .tl{background:var(--tint);box-shadow:none}
.tl.used{visibility:hidden}
.hl{color:var(--acc);font-weight:800}
.wrow{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0;padding-top:0}
.wrow:last-child{padding-bottom:0}
.wj{font:700 1.15rem var(--jp);min-width:5.2rem}
.wr{font:.85rem var(--jp);color:var(--mute);min-width:5.6rem}
.wt{flex:1;min-width:8rem;font-size:.9rem}
.okm{color:var(--good);font-weight:800}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fx span{font:.85rem var(--jp);background:var(--bg);border-radius:8px;padding:2px 9px;color:var(--mute)}

/* ===== прогресс ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal i{display:block;aspect-ratio:1;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
.cal i u{position:absolute;inset:0;background:var(--acc)}
.cal i.today{outline:2px solid var(--acc2);outline-offset:1px}
.in .cal i{animation:cellIn .35s var(--spring) backwards;animation-delay:calc(250ms + var(--c,0) * 14ms)}
.cal.hd{margin-top:0;font-size:.75rem;color:var(--mute);text-align:center}
.pb{display:flex;align-items:center;gap:10px;margin:8px 0}
.pb .k{width:2.2rem;font:800 1.2rem var(--jp);text-align:center}
.pb .tr{flex:1;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.pb .tr i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width 1s cubic-bezier(.3,.9,.3,1) .3s}
.pb .v{width:5.6rem;text-align:right;font-size:.82rem;color:var(--mute)}

/* своё предложение */
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{margin-right:auto}
.plus{flex:0 0 auto;width:44px;height:44px;margin:0 2px 14px 0;border-radius:14px;border:0;background:var(--acc);color:var(--onacc);font:800 24px/1 var(--ui);box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.plus:active{transform:scale(.92)}
textarea[lang=ja]{font:600 1.15rem/1.5 var(--jp)}
.ab{display:flex;flex-wrap:wrap;gap:4px 3px;align-items:center;font:700 1.3rem/1.4 var(--jp);margin:0 0 10px}
.ab .aw.unk{border-bottom:2px dotted var(--acc2)}
.apt{min-width:44px;height:44px;border-radius:12px;border:2px dashed var(--acc);background:var(--tint);color:var(--acc);font:800 1.2rem var(--jp);cursor:pointer;padding:0 6px;transition:transform .25s var(--spring),background .2s,color .2s}
.apt:active{transform:scale(.9)}
.apt.on{border-style:solid;background:var(--acc);color:var(--onacc)}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.92rem;margin:0 0 10px}
.achip{min-width:44px;height:40px;border:0;border-radius:12px;padding:0 12px;background:var(--bg);font:800 1.05rem var(--jp);color:var(--mute);cursor:pointer}
.achip.on{background:var(--good);color:var(--ongood)}
.ard{margin:4px 0 6px}
#f-live{margin-bottom:14px}
.ardl{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:1rem}
.ardl span{font:700 1.1rem var(--jp);min-width:3em}
.ardl input{margin:4px 0}

/* слой «раскрытия» плитки в раздел */
.morph{position:fixed;z-index:4;pointer-events:none;transform-origin:0 0;will-change:transform}

@keyframes tileIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes cellIn{from{transform:scale(0)}to{transform:none}}
@keyframes stampCal{0%{transform:scale(1.9) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes stampIn{0%{transform:scale(1.6) rotate(-10deg);opacity:0}40%{opacity:1}100%{transform:none;opacity:1}}
@keyframes burst{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.45)}}
@keyframes breathe{50%{background:color-mix(in srgb,var(--acc) 26%,transparent)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes sheetUp{from{transform:translate(-50%,105%)}to{transform:translate(-50%,0)}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  // верх раздела: назад и полоска цели дня

  // FURIGANA-BEGIN
  var KANJI_RE = /[一-鿿々0-9０-９]/;
  function splitTokens(t) {
    var out = [], cur = '', k = null;
    for (var i = 0; i < t.length; i++) {
      var c = t.charAt(i), isK = KANJI_RE.test(c);

  }
  function furigana(t, r) {
    if (!t || !r) return null;
    var tk = splitTokens(t);
    // Перебор вариантов границ: чтение иероглифов не может быть короче числа иероглифов
    function go(i, j) {
      if (i === tk.length) return j === r.length ? [] : null;

      }
      var nxt = tk[i + 1];

      var minLen = Math.max(1, x.s.replace(/[0-9０-９]/g, '').length);
      var maxLen = x.s.length * 6 + 3;

  // GRID-BEGIN
  // Рукописная сетка, как бумага для сочинений: один знак — одна клетка.
  // Переносы только между «словами» (иероглифы + окончание), чтобы не рвать слово пополам.
  var OKU = 7;

  function blankCell(fill, anim) {

  // anim — классы анимации для заполненной клетки (' pop' или ' pop late'), необязательно
  function gridHtml(it, fill, wantRuby, wrong, anim) {

    var units = [], prev = null, last = null;
    parts.forEach(function (p) {
      if (p.k) {

          units.push(last);
          prev = null;
        } else if (/[。、！？]/.test(ch) && last) {
          last.cells.push(cellHtml(ch));
        } else if (prev && prev.room > 0) {

  // ---------- своё предложение: вставил фразу → нажал на частицу → написал перевод ----------

  var addq = { text: '', ru: '', blanks: [], alts: {}, rd: {}, from: 'more' };

  // ---------- общие кусочки для «Слов», «Глаголов» и «Собери предложение» ----------

    var tot = cand.reduce(function (a, x) { return a + wt(x); }, 0), r = Math.random() * tot;

  // ---------- Собери предложение ----------

    if (!parts) return toks.map(function () { return ''; });
    var starts = [], pos = 0;
    parts.forEach(function (p) { starts.push(pos); pos += p.s.length; });
    var at = 0;
    return toks.map(function (t) {
      var st = tf.indexOf(t.s, at);

      at = en;

        var ps = starts[pi], pe = ps + parts[pi].s.length;

    else if (act === 'reading') { cur.showR = !cur.showR; render(); }
    else if (act === 'mode') { mode = el.dataset.m; cur = null; next(); }
    else if (act === 'train') switchTo(function () { mode = 'mistakes'; tab = 'practice'; cur = null; next(); });
    else if (act === 'add') addSentence();
    else if (act === 'ablank') {
      var bi = +el.dataset.i, at = addq.blanks.indexOf(bi), mm = addModel();
      if (at >= 0) { addq.blanks.splice(at, 1); delete addq.alts[bi]; }
      else { addq.blanks.push(bi); addq.alts[bi] = altSuggest(mm, bi); }
      liveUpdate();
    }
    else if (act === 'aalt') {
      var ai = +el.dataset.i, list = addq.alts[ai] || (addq.alts[ai] = []), ap = el.dataset.p, aj = list.indexOf(ap);
      if (aj >= 0) list.splice(aj, 1); else list.push(ap);
      liveUpdate();
    }
    else if (act === 'delc') delCustom(el.dataset.id);
    else if (act === 'export') exportData();
    else if (act === 'import') { var inp = document.getElementById('imp'); if (inp) inp.click(); }
    else if (act === 'defread') { settings.reading = !settings.reading; if (cur) cur.showR = settings.reading; saveAll(); togSet(el, settings.reading); }
    else if (act === 'theme') { settings.theme = el.dataset.v; saveAll(); applyTheme(); render(); }
    else if (act === 'hint') { if (cur && !cur.done) { cur.hint = true; render(); } }
    else if (act === 'goal') { settings.goal = +el.dataset.n; saveAll(); render(); }
    else if (act === 'speak') { sayCurrent(); if (notice) render(); }
    else if (act === 'defspeak') { settings.speak = !settings.speak; saveAll(); togSet(el, settings.speak); }
    // слова
    else if (act === 'wseg') { wmode = el.dataset.m; render(); }
    else if (act === 'wans') answerChoice(wq, +el.dataset.i, wstats);
    else if (act === 'wnext') slideNext(function () { newWordQ(); render(); });
    else if (act === 'wread') { if (wq) { wq.showR = !wq.showR; render(); } }
    else if (act === 'wsay') { if (wq) { speak(wq.say); if (notice) render(); } }
    // глаголы
    else if (act === 'vseg') { vmode = el.dataset.m; render(); }
    else if (act === 'vans') answerChoice(vq, +el.dataset.i, vstats);
    else if (act === 'vnext') slideNext(function () { newVerbQ(); render(); });
    else if (act === 'vread') { if (vq) { vq.showR = !vq.showR; render(); } }
    else if (act === 'vsay') { if (vq) { speak(vq.say); if (notice) render(); } }
    // собери предложение
    else if (act === 'bpick') { if (bq && !bq.done && bq.picked.indexOf(+el.dataset.k) < 0) { bq.picked.push(+el.dataset.k); bPop = bq.picked.length - 1; render(); } }
    else if (act === 'bdel') { if (bq && !bq.done) { bq.picked.splice(+el.dataset.k, 1); render(); } }
    else if (act === 'bclear') { if (bq && !bq.done) { bq.picked = []; render(); } }
    else if (act === 'bcheck') checkBuild();
    else if (act === 'bnext') slideNext(function () { newBuild(); render(); });
    else if (act === 'bread') { if (bq) { bq.showR = !bq.showR; render(); } }
    else if (act === 'bsay') { if (bq) { speak(bq.say); if (notice) render(); } }
    else if (act === 'reset') {
      if (!resetArmed) { resetArmed = true; render(); }
      else { stats = {}; days = {}; wstats = {}; vstats = {}; bstats = {}; wq = vq = bq = null; resetArmed = false; saveAll(); notice = 'Прогресс и дневник ошибок сброшены.'; cur = null; next(); }
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'f-t') {
      addq.text = t.value;
      var m = addModel();
      addq.blanks = addq.blanks.filter(function (b) { return m.toks[b] && m.toks[b].p; });
      liveUpdate();
    } else if (t.id === 'f-ru') addq.ru = t.value;
    else if (t.dataset && t.dataset.rd) {
      addq.rd[t.dataset.rd] = t.value.trim();
      var pv = document.getElementById('f-prev');
      if (pv) pv.outerHTML = readPreview(addModel());
    }
  });

  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'imp') return;
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var err = importData(String(rd.result));
      notice = err ? err : 'Данные загружены.';
      tab = 'more'; cur = null; next();
    };
    rd.readAsText(f);
  });

  try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch (e) {}
  next();
  enterFx();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
