<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="yuki.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Частицы</title>
<style>
:root{
  --jp:"Noto Serif JP","Noto Serif CJK JP","Hiragino Mincho ProN","Yu Mincho","Source Han Serif JP",serif;
  --bg:#f1f4ee;--sheet:#fbfcf8;--grid:#b4cdc1;--line:#d3dcd1;--ink:#1c2733;--mute:#66737f;
  --accent:#2c4aa0;--on-accent:#ffffff;--tint:rgba(44,74,160,.09);--good:#237a57;--pen:#c8382f;--cell:38px
}
@media (prefers-color-scheme: dark){:root{--bg:#0f1317;--sheet:#161c21;--grid:#2f4047;--line:#242d34;--ink:#e8eee8;--mute:#8794a0;--accent:#8da6ff;--on-accent:#0e1430;--tint:rgba(141,166,255,.12);--good:#6fcf9f;--pen:#ff7c70}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(88px + env(safe-area-inset-bottom))}
h2{font-size:1.15rem;font-weight:600;margin:6px 0 14px}
h3{font-size:1rem;font-weight:600;margin:18px 0 8px}
.card h3{margin-top:0}
b{font-weight:600}
[lang=ja]{font-family:var(--jp)}

.meter{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--mute)}
.meter b{color:var(--ink)}
.bar{height:3px;background:var(--line);margin:8px 0 14px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.seal{display:inline-block;font:normal 600 .72rem/1 var(--jp);color:#fff;background:var(--pen);padding:3px 4px;border-radius:2px;transform:rotate(-6deg);margin-left:6px;vertical-align:1px}

.seg{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg button{flex:1;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mute);padding:10px 4px;font:inherit;font-size:.92rem}
.seg button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.4}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px 14px 12px;margin-bottom:14px}
.grid{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:6px;padding:1px}
.u{display:flex;flex-direction:column;align-items:flex-start;flex:0 0 auto;max-width:100%}
.cs{display:flex;flex-wrap:wrap;justify-content:flex-start}
.c{position:relative;display:grid;place-items:center;width:var(--cell);height:var(--cell);border:1px solid var(--grid);margin:0 -1px -1px 0;font-size:calc(var(--cell)*.62);line-height:1;color:var(--ink)}
.c.blank{border-color:var(--accent);background:var(--tint);z-index:1}
.c.fill{border-color:var(--good);color:var(--good);font-weight:700;z-index:1;animation:stamp .22s ease-out}
.c.wide{width:auto;min-width:var(--cell);padding:0 5px;font-size:calc(var(--cell)*.5)}
.rt{display:flex;justify-content:center;font-size:11px;line-height:1.15;color:var(--mute);padding-bottom:2px;white-space:nowrap}
.rt .pen{color:var(--pen);font-size:14px;text-decoration:line-through;text-decoration-thickness:2px;animation:fade .25s ease-out}
.read{font-family:var(--jp);font-size:1rem;color:var(--mute);margin-top:10px}
.ru{margin-top:14px;color:var(--mute)}
.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px}
.link{background:none;border:0;color:var(--accent);padding:8px 0 0;font:inherit;font-size:.9rem}

.note{border-left:3px solid var(--accent);background:var(--tint);padding:10px 12px;margin:0 0 12px;font-size:.92rem;border-radius:0 8px 8px 0}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-family:var(--jp);font-size:1.45rem}
.key.w2{grid-column:span 2}
.key:active{background:var(--tint);border-color:var(--accent)}

.res{border-left:3px solid var(--good);padding:2px 0 2px 14px;margin:4px 0 0}
.res.no{border-left-color:var(--pen)}
.verdict{font-weight:600;font-size:1.1rem;margin-bottom:6px}
.res.ok .verdict{color:var(--good)}
.res.no .verdict{color:var(--pen)}
.rule{margin:10px 0 6px}
.goalmsg{margin-top:10px;font-size:.9rem;color:var(--mute)}
.small{font-size:.9rem;color:var(--mute);margin-top:4px}

.primary,.ghost,.danger{display:block;width:100%;height:50px;border-radius:8px;font:inherit;font-weight:600;font-size:1rem;margin-top:14px}
.primary{border:0;background:var(--accent);color:var(--on-accent)}
.primary:disabled{opacity:.4}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);margin-top:10px}
.danger{border:1px solid var(--line);background:none;color:var(--pen)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.chip{border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:.88rem;color:var(--mute)}
.chip b{color:var(--ink);font-family:var(--jp)}
.sent{font-family:var(--jp);font-size:1.15rem;line-height:1.6}
.sent .fill{color:var(--good);font-weight:700;border-bottom:2px solid var(--good);padding:0 1px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tog{border:1px solid var(--line);background:none;color:var(--mute);border-radius:6px;padding:6px 14px;font:inherit}
.tog.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
textarea,input[type=text],select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;margin:4px 0 12px}
label{font-size:.85rem;color:var(--mute)}
.row{display:flex;gap:10px}
.row>div{flex:1}

#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;border-top:2px solid transparent;margin-top:-1px;background:none;color:var(--mute);font:inherit;font-size:.78rem;padding:7px 4px 9px}
#tabs b{font:normal 1.3rem/1.2 var(--jp)}
#tabs button.on{color:var(--accent);border-top-color:var(--accent);font-weight:600}

.mas{display:flex;align-items:flex-end;gap:10px;margin:4px 0 14px}
.mas .yuki{width:122px}
.mas .say{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:40px;font-size:.92rem;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mas .say.bump{transform:scale(1.04)}
.mas .say:before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--sheet);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.mini{display:flex;align-items:flex-end;gap:10px}
.mini .yuki{width:64px}
.res .mini{margin-top:6px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;color:var(--ink);font:inherit}
.tile .ic{font:600 1.9rem/1 var(--jp);width:44px;text-align:center;color:var(--accent)}
.tile .tx{flex:1}.tile .tx b{display:block}.tile .tx span{font-size:.85rem;color:var(--mute)}
.tile:disabled{opacity:.45}
.tile:not(:disabled):active{border-color:var(--accent)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:.9rem;padding:0 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal i{display:block;aspect-ratio:1;border-radius:4px;border:1px solid var(--line);position:relative;overflow:hidden}
.cal i u{position:absolute;inset:0;background:var(--accent)}
.cal i.today{outline:2px solid var(--ink);outline-offset:1px}
.cal.hd{margin-top:0;font-size:.75rem;color:var(--mute);text-align:center}
.pb{display:flex;align-items:center;gap:10px;margin:8px 0}
.pb .k{width:2.2rem;font:1.2rem var(--jp);text-align:center}
.pb .t{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pb .t i{display:block;height:100%;background:var(--accent)}
.pb .v{width:5.6rem;text-align:right;font-size:.82rem;color:var(--mute)}
.kicker{font-size:.8rem;color:var(--mute);text-align:center}
.big{font:600 2.5rem/1.25 var(--jp);text-align:center;margin:6px 0 2px;word-break:keep-all}
.sub{font-family:var(--jp);text-align:center;color:var(--mute);min-height:1.5em}
.sub2{text-align:center;font-size:.85rem;color:var(--mute);margin-top:4px}
.sheet .links.lc{justify-content:center}
.task{font-size:1.15rem;font-weight:600;text-align:center;margin-top:4px}
.choices{display:grid;gap:8px}
.choice{min-height:52px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;text-align:left;padding:10px 14px}
.choice:not(:disabled):active{background:var(--tint);border-color:var(--accent)}
.choice.right{border-color:var(--good);color:var(--good);font-weight:600;border-width:2px}
.choice.wrong{border-color:var(--pen);color:var(--pen);text-decoration:line-through}
.choice.dim{opacity:.5}
.slot{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:66px;padding:8px;border:1px dashed var(--grid);border-radius:8px;background:var(--sheet);margin-bottom:12px}
.slot:empty:before{content:"Нажимай на плитки по порядку";color:var(--mute);font-size:.88rem;align-self:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.tl{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:48px;min-width:44px;padding:4px 10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:1.2rem/1.2 var(--jp)}
.tl small{font-size:.6rem;line-height:1.2;color:var(--mute)}
.tl:active{border-color:var(--accent)}
.slot .tl{border-color:var(--accent);background:var(--tint);animation:fade .15s ease-out}
.tl.used{visibility:hidden}
.hl{color:var(--accent);font-weight:700}
.wrow{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0;padding-top:0}
.wrow:last-child{padding-bottom:0}
.wj{font:1.15rem var(--jp);min-width:5.2rem}
.wr{font:.85rem var(--jp);color:var(--mute);min-width:5.6rem}
.wt{flex:1;min-width:8rem;font-size:.9rem}
.okm{color:var(--good);font-weight:700}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fx span{font:.85rem var(--jp);border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mute)}
@keyframes stamp{0%{transform:scale(1.5) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs">
  <button data-tab="home"><b lang="ja">学</b><span>Учить</span></button>
  <button data-tab="diary"><b lang="ja">誤</b><span>Ошибки</span></button>
  <button data-tab="progress"><b lang="ja">進</b><span>Прогресс</span></button>
  <button data-tab="more"><b lang="ja">他</b><span>Ещё</span></button>
</nav>
<script src="data.js"></script>
<script src="words.js"></script>
<script src="yuki.js"></script>
<script>
(function () {
  'use strict';

  var PARTS = ['は','が','を','に','で','へ','と','も','の','や','から','まで','か'];
  var RULES = {
    'は': 'Тема предложения: «что касается…». Читается «ва».',
    'が': 'Подлежащее. Обязательна после すき, わかる, ほしい, できる и в «есть/находится» (います・あります).',
    'を': 'Прямое дополнение: на что направлено действие. Читается «о».',
    'に': 'Точное время, пункт назначения, где что-то находится или живёт кто-то, адресат действия.',
    'で': 'Место, где происходит действие, или средство: чем, на чём, на каком языке.',
    'へ': 'Направление движения (читается «э»). Почти всегда заменяется на に.',
    'と': '«С кем» или полный список «и». Ещё цитата перед 言う.',
    'も': '«Тоже, также». Занимает место は, が или を.',
    'の': 'Принадлежность или связь двух существительных: «чей, какой».',
    'や': 'Неполный список: «и то, и это, и ещё что-то».',
    'から': '«Из, с, от»: начало во времени или в пространстве, а ещё «от кого».',
    'まで': '«До»: конец во времени или в пространстве.',
    'か': 'Вопросительная частица в конце предложения.'
  };
  var USES = {
    "wa_topic": "Тема: то, о чём говорим. Ставится после слова-темы, а дальше сообщается, что о нём сказать. Читается «ва».",
    "wa_contrast": "Противопоставление: ставится после слова, которое сравнивают с другим («мясо ем, а рыбу — нет»). Читается «ва».",
    "ga_like": "Ставится после того, что нравится, не нравится, понятно, нужно или получается: すき, きらい, じょうず, へた, わかる, ほしい, できる. По-русски это похоже на дополнение («люблю кошек»), но по-японски тут が.",
    "ga_exist": "Ставится после того, что есть или у кого что есть: あります, います, ありません.",
    "ga_subj": "Подлежащее в сообщении о событии: идёт дождь, пришёл поезд, плачет ребёнок. Новость «что-то происходит» — с が.",
    "ga_q": "Если подлежащее — вопросительное слово (だれ, 何, どれ), ставится が, а не は.",
    "wo_obj": "Ставится после того, на что направлено действие: что ем, читаю, включаю, открываю. Читается «о».",
    "wo_path": "Ставится после места, по которому проходят: 道を渡る, 橋を渡る. Читается «о».",
    "ni_time": "Ставится после точного времени: час (7時), день недели, месяц.",
    "ni_freq": "Ставится после периода, когда считаем частоту: «три раза в неделю», «раз в день».",
    "ni_dest": "Ставится после пункта назначения: куда идут, приезжают, входят, ходят регулярно.",
    "ni_ride": "Ставится после того, во что или на что садятся: поезд, автобус, стул.",
    "ni_loc": "Ставится после места, где что-то находится или кто-то живёт: あります, います, 住んでいます.",
    "ni_target": "Ставится после адресата, к кому направлено действие: кому звоню, пишу, дарю, кого спрашиваю, с кем встречаюсь.",
    "ni_put": "Ставится после места, куда что-то кладут, ставят или добавляют.",
    "ni_purpose": "Ставится после действия или занятия, ради которого идут или приезжают: 買い物に行く, 勉強に来る.",
    "ni_become": "Ставится после того, кем или чем становятся (なる).",
    "he_dir": "Ставится после пункта назначения: куда направлено движение. Читается «э». В таких предложениях вместо へ подходит и に.",
    "de_place": "Ставится после места, где происходит действие: учусь в школе, ем в ресторане, работаю в компании.",
    "de_means": "Ставится после средства: чем делаю, на чём еду, на каком языке говорю.",
    "de_total": "Ставится после состава или суммы: «в одиночку», «всего».",
    "to_with": "Ставится после того, с кем делают что-то вместе: «с братом», «с мамой».",
    "to_and": "Ставится между перечисляемыми словами и значит «и» (полный список): хлеб и молоко.",
    "to_quote": "Ставится после цитаты или мысли, перед глаголом 言う (сказать).",
    "mo_also": "Ставится вместо は, が или を, когда нужно «тоже»: после того, что тоже подходит.",
    "mo_neg": "С отрицанием значит «ни один, совсем нет»: 一人もいません.",
    "no_poss": "Ставится после владельца: слева хозяин, справа то, что ему принадлежит («моя книга»).",
    "no_attr": "Соединяет два существительных: левое уточняет правое (какой? откуда? о чём?): 日本語の先生, 英語の本.",
    "no_loc": "Связывает предмет-ориентир и слово места: 机の上 — «верх стола», то есть «на столе». Слева стоит ориентир (стол, станция), справа слово места (上 верх, 下 низ, 近く рядом). То, что лежит или стоит (книга), в этой связке не участвует.",
    "kara_start": "Ставится после начальной точки: времени или места. «С 9 часов», «из Токио», «отсюда».",
    "kara_person": "Ставится после человека, от которого что-то получили: «от мамы», «у учителя».",
    "made": "Ставится после конечной точки: времени или места. «До пяти», «до школы».",
    "ya": "Неполный список: называем несколько примеров из многих и подразумеваем «и так далее».",
    "ka_q": "В конце предложения превращает его в вопрос.",
    "ka_or": "Между вариантами значит «или»: кофе или чай."
  };
  function ruleFor(it, p, i) {
    var m = /^b(\d+)$/.exec(it.id || ''), k = m && window.USE && window.USE[+m[1]];
    return (i === 0 && k && USES[k]) || RULES[p] || '';
  }
  var MSG_OK = ['Верно.', 'Точно!', 'Да, именно так.', 'В точку.', 'Чисто сработано.', 'Есть!'];
  var MSG_BAD = ['Мимо.', 'Не то.', 'Тут легко запутаться.', 'Почти, но нет.', 'Ошибка — зато теперь запомнится.'];

  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var stats = LS.get('jp_stats', {});
  var custom = LS.get('jp_custom', []);
  var days = LS.get('jp_days', {});
  var settings = Object.assign({ reading: false, speak: false, goal: 10 }, LS.get('jp_settings', {}));
  // Прогресс разделов «Слова», «Глаголы», «Собери предложение»: отдельные ключи, старые не трогаем.
  var wstats = LS.get('jp_words', {});
  var vstats = LS.get('jp_verbs', {});
  var bstats = LS.get('jp_build', {});
  var tab = 'home', mode = 'all', cur = null, notice = '', resetArmed = false;
  var wmode = 'quiz', vmode = 'mean', wq = null, vq = null, bq = null;
  var $app = document.getElementById('app');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function saveAll() {
    LS.set('jp_stats', stats); LS.set('jp_custom', custom); LS.set('jp_days', days); LS.set('jp_settings', settings);

  // ---------- общие кусочки для «Слов», «Глаголов» и «Собери предложение» ----------

      at = en;
      if (!KANJI_RE.test(t.s)) return '';
      for (var pi = 0; pi < parts.length; pi++) {
        var ps = starts[pi], pe = ps + parts[pi].s.length;
        if (pe <= st || ps >= en) continue;
        if (parts[pi].k) { if (ps < st || pe > en) ok = false; else rd += parts[pi].rd; }
        else rd += tf.slice(Math.max(ps, st), Math.min(pe, en));
      }
      return ok ? rd : '';
    });
  }
  // куски «слово + падежная частица» можно переставлять, сказуемое остаётся в конце
  var MOVABLE_AFTER = ['は', 'が', 'を', 'に', 'で', 'へ', 'から', 'まで', 'も'];
  function phrases(toks) {
    var args = [], cur = '';
    toks.forEach(function (t) { cur += t.s; if (t.p && MOVABLE_AFTER.indexOf(t.s) >= 0) { args.push(cur); cur = ''; } });
    return { args: args.sort().join('|'), pred: cur };
  }
  function newBuild() {
    var V = vocab(), base = window.BASE || [];
    var list = base.map(function (s, i) { return { id: 'b' + i, i: i }; }).filter(function (x) { return V.segs[x.i].length > 1 && !V.segs[x.i].some(function (t) { return t.unk; }); });
    var x = pickFrom(list, bstats, bq && bq.it.id), it = base[x.i], toks = V.segs[x.i], rd = tokenReadings(it, toks);
    var tiles = toks.map(function (t, k) { return { s: t.s, p: t.p, rd: rd[k] }; });
    var have = toks.map(function (t) { return t.s; });
    var spare = TOKEN_PARTS.filter(function (p) { return p !== 'か' && have.indexOf(p) < 0 && it.a.indexOf(p) < 0; });
    if (spare.length) tiles.push({ s: rnd(spare), p: true, rd: '', spare: true });
    var idx = tiles.map(function (t, k) { return k; }), order = shuffle(idx);
    for (var n = 0; n < 5 && order.slice(0, toks.length).join() === idx.slice(0, toks.length).join(); n++) order = shuffle(idx);
    bq = { it: { id: x.id }, i: x.i, item: it, toks: toks, tiles: tiles, order: order, picked: [], done: false, showR: settings.reading, say: filled(x.i) };
  }
  function tileHtml(t, act, k, showR, used) {
    return '<button class="tl' + (used ? ' used' : '') + '" lang="ja" data-act="' + act + '" data-k="' + k + '"' + (used ? ' disabled' : '') + '>' +
      (showR && t.rd ? '<small>' + esc(t.rd) + '</small>' : '') + esc(t.s) + '</button>';
  }
  function checkBuild() {
    var q = bq;
    if (!q || q.done || q.picked.length !== q.toks.length) return;
    var mine = q.picked.map(function (k) { return q.tiles[k]; });
    var want = q.toks.map(function (t) { return t.s; }).join(''), got = mine.map(function (t) { return t.s; }).join('');
    var ok = got === want, alt = false;
    if (!ok && q.item.t.indexOf('、') < 0) {
      var A = phrases(q.toks), B = phrases(mine);
      if (A.pred === B.pred && A.args === B.args) ok = alt = true;
    }
    var s = markStat(bstats, q.it.id, ok);
    q.done = true; q.ok = ok; q.alt = alt; q.got = got; q.msg = rnd(ok ? MSG_OK : MSG_BAD);
    q.goal = countDay(ok);
    q.extra = ok && s.c === 3 ? 'Три раза подряд без ошибок — предложение собрано уверенно.' : '';
    if (!ok) buzz();
    saveAll();
    render();
    if (settings.speak) { speak(q.say); if (notice) render(); }
  }
  function renderBuild() {
    if (!bq) newBuild();
    var q = bq, it = q.item, a0 = it.a[0];
    var h = noticeHtml() + '<button class="back" data-tab="home">‹ Разделы</button>' + meterHtml();
    h += '<section class="sheet"><div class="kicker">Собери по-японски</div><div class="task">' + esc(it.ru) + '</div></section>';
    if (!q.done) {
      h += '<div class="slot">' + q.picked.map(function (k, pos) { return tileHtml(q.tiles[k], 'bdel', pos, q.showR); }).join('') + '</div>';
      h += '<div class="tiles">' + q.order.map(function (k) { return tileHtml(q.tiles[k], 'bpick', k, q.showR, q.picked.indexOf(k) >= 0); }).join('') + '</div>';
      h += '<div class="links"><button class="link" data-act="bread">' + (q.showR ? 'Скрыть чтение' : 'Показать чтение') + '</button>' + (q.picked.length ? '<button class="link" data-act="bclear">Начать заново</button>' : '') + '</div>';
      if (q.tiles.length > q.toks.length) h += '<div class="small">Одна частица здесь лишняя. Нажми на плитку в ответе, чтобы вернуть её.</div>';
      h += '<button class="primary" data-act="bcheck"' + (q.picked.length === q.toks.length ? '' : ' disabled') + '>Проверить</button>';
      return h;
    }
    var g = gridHtml(it, a0, !!(q.showR && it.r), '');
    h += '<section class="sheet">' + g.html + '<div class="links"><button class="link" data-act="bread">' + (q.showR ? 'Скрыть фуригану' : 'Показать фуригану') + '</button><button class="link" data-act="bsay">Послушать</button></div></section>';
    var body = '';
    if (!q.ok) body += '<div>Твой вариант: <span lang="ja">' + esc(q.got) + '</span></div><div class="small">Правильный порядок — на листе выше.</div>';
    else if (q.alt) body += '<div class="small">Твой порядок тоже правильный. В учебной фразе слова стоят так, как на листе выше.</div>';
    body += '<div class="rule">Главная частица этой фразы — <b lang="ja">' + esc(a0) + '</b>: ' + esc(ruleFor({ id: q.it.id }, a0, 0)) + '</div>';
    return h + verdictHtml(q, body, 'bnext');
  }

  function render() {
    var tabs = document.querySelectorAll('#tabs button');
    var nav = /^(practice|words|verbs|build)$/.test(tab) ? 'home' : tab === 'add' ? 'more' : tab;
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('on', tabs[i].dataset.tab === nav);
    var h = tab === 'practice' ? renderPractice() : tab === 'words' ? renderWords() : tab === 'verbs' ? renderVerbs() : tab === 'build' ? renderBuild() :
      tab === 'diary' ? renderDiary() : tab === 'add' ? renderAdd() : tab === 'progress' ? renderProgress() : tab === 'home' ? renderHome() : renderMore();
    $app.innerHTML = h;
    mountYuki();
  }

  // ---------- действия ----------
  function addSentence() {
    var g = function (id) { return document.getElementById(id); };
    var msg = g('f-msg');
    var norm = function (s) { return s.replace(/[_＿]+/g, '＿').trim(); };
    var cnt = function (s) { return (s.match(/＿/g) || []).length; };
    var t = norm(g('f-t').value), r = norm(g('f-r').value), ru = g('f-ru').value.trim();
    var a = uniq([g('f-a1').value, g('f-a2').value].filter(Boolean));
    if (cnt(t) !== 1) { msg.textContent = 'В предложении должно быть ровно одно пропущенное место ＿.'; return; }
    if (r && cnt(r) !== 1) { msg.textContent = 'В чтении тоже нужен ровно один знак ＿.'; return; }
    if (!ru) { msg.textContent = 'Напиши перевод или смысл: по нему видно, какая частица нужна.'; return; }
    custom.push({ id: 'c' + Date.now(), t: t, r: r, a: a, ru: ru });
    saveAll();
    notice = 'Добавлено, оно уже в общей очереди.';
    render();
  }
  function delCustom(id) {
    custom = custom.filter(function (it) { return it.id !== id; });
    delete stats[id];
    saveAll();
    if (cur && cur.item.id === id) { cur = null; next(); } else render();
  }
  function exportData() {
    var data = JSON.stringify({ v: 1, stats: stats, custom: custom, days: days, settings: settings, words: wstats, verbs: vstats, build: bstats });
    var blob = new Blob([data], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'particles-backup-' + dayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    notice = 'Файл копии сохранён (папка «Загрузки»).';
    render();
  }
  function validCustom(c) {
    return c && typeof c.id === 'string' && typeof c.t === 'string' && typeof c.ru === 'string' &&
      Array.isArray(c.a) && c.a.length > 0 && c.a.every(function (p) { return PARTS.indexOf(p) >= 0; });
  }
  function importData(txt) {
    var d;
    try { d = JSON.parse(txt); } catch (e) { return 'Это не похоже на файл копии.'; }
    if (!d || typeof d !== 'object' || typeof d.stats !== 'object') return 'В файле нет данных прогресса.';
    stats = d.stats || {};
    custom = Array.isArray(d.custom) ? d.custom.filter(validCustom) : [];
    days = d.days && typeof d.days === 'object' ? d.days : {};
    settings = Object.assign({ reading: false, speak: false, goal: 10 }, d.settings || {});
    // в старых копиях этих полей нет — тогда разделы начинаются с нуля
    var obj = function (x) { return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; };
    wstats = obj(d.words); vstats = obj(d.verbs); bstats = obj(d.build);
    wq = vq = bq = null;
    saveAll();
    return null;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; resetArmed = false; render(); window.scrollTo(0, 0); return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'ans') answer(el.dataset.p);
    else if (act === 'open') { mode = el.dataset.m; tab = 'practice'; cur = null; next(); window.scrollTo(0, 0); }
    else if (act === 'next') { next(); window.scrollTo(0, 0); }
    else if (act === 'reading') { cur.showR = !cur.showR; render(); }
    else if (act === 'mode') { mode = el.dataset.m; cur = null; next(); }
    else if (act === 'train') { mode = 'mistakes'; tab = 'practice'; cur = null; next(); window.scrollTo(0, 0); }
    else if (act === 'add') addSentence();
    else if (act === 'delc') delCustom(el.dataset.id);
    else if (act === 'export') exportData();
    else if (act === 'import') { var inp = document.getElementById('imp'); if (inp) inp.click(); }
    else if (act === 'defread') { settings.reading = !settings.reading; if (cur) cur.showR = settings.reading; saveAll(); render(); }
    else if (act === 'hint') { if (cur && !cur.done) { cur.hint = true; render(); } }
    else if (act === 'goal') { settings.goal = +el.dataset.n; saveAll(); render(); }
    else if (act === 'speak') { sayCurrent(); if (notice) render(); }
    else if (act === 'defspeak') { settings.speak = !settings.speak; saveAll(); render(); }
    // слова
    else if (act === 'wseg') { wmode = el.dataset.m; render(); }
    else if (act === 'wans') answerChoice(wq, +el.dataset.i, wstats);
    else if (act === 'wnext') { newWordQ(); render(); window.scrollTo(0, 0); }
    else if (act === 'wread') { if (wq) { wq.showR = !wq.showR; render(); } }
    else if (act === 'wsay') { if (wq) { speak(wq.say); if (notice) render(); } }
    // глаголы
    else if (act === 'vseg') { vmode = el.dataset.m; render(); }
    else if (act === 'vans') answerChoice(vq, +el.dataset.i, vstats);
    else if (act === 'vnext') { newVerbQ(); render(); window.scrollTo(0, 0); }
    else if (act === 'vread') { if (vq) { vq.showR = !vq.showR; render(); } }
    else if (act === 'vsay') { if (vq) { speak(vq.say); if (notice) render(); } }
    // собери предложение
    else if (act === 'bpick') { if (bq && !bq.done && bq.picked.indexOf(+el.dataset.k) < 0) { bq.picked.push(+el.dataset.k); render(); } }
    else if (act === 'bdel') { if (bq && !bq.done) { bq.picked.splice(+el.dataset.k, 1); render(); } }
    else if (act === 'bclear') { if (bq && !bq.done) { bq.picked = []; render(); } }
    else if (act === 'bcheck') checkBuild();
    else if (act === 'bnext') { newBuild(); render(); window.scrollTo(0, 0); }
    else if (act === 'bread') { if (bq) { bq.showR = !bq.showR; render(); } }
    else if (act === 'bsay') { if (bq) { speak(bq.say); if (notice) render(); } }
    else if (act === 'reset') {
      if (!resetArmed) { resetArmed = true; render(); }
      else { stats = {}; days = {}; wstats = {}; vstats = {}; bstats = {}; wq = vq = bq = null; resetArmed = false; saveAll(); notice = 'Прогресс и дневник ошибок сброшены.'; cur = null; next(); }
    }
  });

  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'imp') return;
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var err = importData(String(rd.result));
      notice = err ? err : 'Данные загружены.';
      tab = 'more'; cur = null; next();
    };
    rd.readAsText(f);
  });

  try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch (e) {}
  next();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
