<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Частицы</title>
<style>
:root{
  --jp:"Noto Serif JP","Noto Serif CJK JP","Hiragino Mincho ProN","Yu Mincho","Source Han Serif JP",serif;
  --bg:#f1f4ee;--sheet:#fbfcf8;--grid:#b4cdc1;--line:#d3dcd1;--ink:#1c2733;--mute:#66737f;
  --accent:#2c4aa0;--on-accent:#ffffff;--tint:rgba(44,74,160,.09);--good:#237a57;--pen:#c8382f;--cell:38px
}
@media (prefers-color-scheme: dark){:root{--bg:#0f1317;--sheet:#161c21;--grid:#2f4047;--line:#242d34;--ink:#e8eee8;--mute:#8794a0;--accent:#8da6ff;--on-accent:#0e1430;--tint:rgba(141,166,255,.12);--good:#6fcf9f;--pen:#ff7c70}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(88px + env(safe-area-inset-bottom))}
h2{font-size:1.15rem;font-weight:600;margin:6px 0 14px}
h3{font-size:1rem;font-weight:600;margin:18px 0 8px}
.card h3{margin-top:0}
b{font-weight:600}
[lang=ja]{font-family:var(--jp)}

.meter{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--mute)}
.meter b{color:var(--ink)}
.bar{height:3px;background:var(--line);margin:8px 0 14px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.seal{display:inline-block;font:normal 600 .72rem/1 var(--jp);color:#fff;background:var(--pen);padding:3px 4px;border-radius:2px;transform:rotate(-6deg);margin-left:6px;vertical-align:1px}

.seg{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg button{flex:1;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mute);padding:10px 4px;font:inherit;font-size:.92rem}
.seg button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.4}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px 14px 12px;margin-bottom:14px}
.grid{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:6px;padding:1px}
.u{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;max-width:100%}
.cs{display:flex;flex-wrap:wrap;justify-content:center}
.c{position:relative;display:grid;place-items:center;width:var(--cell);height:var(--cell);border:1px solid var(--grid);margin:0 -1px -1px 0;font-size:calc(var(--cell)*.62);line-height:1;color:var(--ink)}
.c.blank{border-color:var(--accent);background:var(--tint);z-index:1}
.c.fill{border-color:var(--good);color:var(--good);font-weight:700;z-index:1;animation:stamp .22s ease-out}
.c.wide{width:auto;min-width:var(--cell);padding:0 5px;font-size:calc(var(--cell)*.5)}
.rt{font-size:11px;line-height:1.15;color:var(--mute);padding-bottom:2px;white-space:nowrap;text-align:center}
.rt .pen{color:var(--pen);font-size:14px;text-decoration:line-through;text-decoration-thickness:2px;animation:fade .25s ease-out}
.read{font-family:var(--jp);font-size:1rem;color:var(--mute);margin-top:10px}
.ru{margin-top:14px;color:var(--mute)}
.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px}
.link{background:none;border:0;color:var(--accent);padding:8px 0 0;font:inherit;font-size:.9rem}

.note{border-left:3px solid var(--accent);background:var(--tint);padding:10px 12px;margin:0 0 12px;font-size:.92rem;border-radius:0 8px 8px 0}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-family:var(--jp);font-size:1.45rem}
.key.w2{grid-column:span 2}
.key:active{background:var(--tint);border-color:var(--accent)}

.res{border-left:3px solid var(--good);padding:2px 0 2px 14px;margin:4px 0 0}
.res.no{border-left-color:var(--pen)}
.verdict{font-weight:600;font-size:1.1rem;margin-bottom:6px}
.res.ok .verdict{color:var(--good)}
.res.no .verdict{color:var(--pen)}
.rule{margin:10px 0 6px}
.goalmsg{margin-top:10px;font-size:.9rem;color:var(--mute)}
.small{font-size:.9rem;color:var(--mute);margin-top:4px}

.primary,.ghost,.danger{display:block;width:100%;height:50px;border-radius:8px;font:inherit;font-weight:600;font-size:1rem;margin-top:14px}
.primary{border:0;background:var(--accent);color:var(--on-accent)}
.primary:disabled{opacity:.4}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);margin-top:10px}
.danger{border:1px solid var(--line);background:none;color:var(--pen)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.chip{border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:.88rem;color:var(--mute)}
.chip b{color:var(--ink);font-family:var(--jp)}
.sent{font-family:var(--jp);font-size:1.15rem;line-height:1.6}
.sent .fill{color:var(--good);font-weight:700;border-bottom:2px solid var(--good);padding:0 1px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tog{border:1px solid var(--line);background:none;color:var(--mute);border-radius:6px;padding:6px 14px;font:inherit}
.tog.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
textarea,input[type=text],select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;margin:4px 0 12px}
label{font-size:.85rem;color:var(--mute)}
.row{display:flex;gap:10px}
.row>div{flex:1}

#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;border-top:2px solid transparent;margin-top:-1px;background:none;color:var(--mute);font:inherit;font-size:.78rem;padding:7px 4px 9px}
#tabs b{font:normal 1.3rem/1.2 var(--jp)}
#tabs button.on{color:var(--accent);border-top-color:var(--accent);font-weight:600}

@keyframes stamp{0%{transform:scale(1.5) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs">
  <button data-tab="practice"><b lang="ja">練</b><span>Практика</span></button>
  <button data-tab="diary"><b lang="ja">誤</b><span>Дневник</span></button>
  <button data-tab="add"><b lang="ja">加</b><span>Добавить</span></button>
  <button data-tab="more"><b lang="ja">他</b><span>Ещё</span></button>
</nav>
<script src="data.js"></script>
<script>
(function () {
  'use strict';

  var PARTS = ['は','が','を','に','で','へ','と','も','の','や','から','まで','か'];
  var RULES = {
    'は': 'Тема предложения: «что касается…». Читается «ва».',
    'が': 'Подлежащее. Обязательна после すき, わかる, ほしい, できる и в «есть/находится» (います・あります).',
    'を': 'Прямое дополнение: на что направлено действие. Читается «о».',
    'に': 'Точное время, пункт назначения, где что-то находится или живёт кто-то, адресат действия.',
    'で': 'Место, где происходит действие, или средство: чем, на чём, на каком языке.',
    'へ': 'Направление движения (читается «э»). Почти всегда заменяется на に.',
    'と': '«С кем» или полный список «и». Ещё цитата перед 言う.',
    'も': '«Тоже, также». Занимает место は, が или を.',
    'の': 'Принадлежность или связь двух существительных: «чей, какой».',
    'や': 'Неполный список: «и то, и это, и ещё что-то».',
    'から': '«Из, с, от»: начало во времени или в пространстве, а ещё «от кого».',
    'まで': '«До»: конец во времени или в пространстве.',
    'か': 'Вопросительная частица в конце предложения.'
  };
  var MSG_OK = ['Верно.', 'Точно!', 'Да, именно так.', 'В точку.', 'Чисто сработано.', 'Есть!'];
  var MSG_BAD = ['Мимо.', 'Не то.', 'Тут легко запутаться.', 'Почти, но нет.', 'Ошибка — зато теперь запомнится.'];

  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var stats = LS.get('jp_stats', {});
  var custom = LS.get('jp_custom', []);
  var days = LS.get('jp_days', {});
  var settings = Object.assign({ reading: false, speak: false, goal: 10 }, LS.get('jp_settings', {}));
  var tab = 'practice', mode = 'all', cur = null, notice = '', resetArmed = false;
  var $app = document.getElementById('app');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function saveAll() {
    LS.set('jp_stats', stats); LS.set('jp_custom', custom); LS.set('jp_days', days); LS.set('jp_settings', settings);
  }
  function allItems() {
    return (window.BASE || []).map(function (s, i) { return Object.assign({ id: 'b' + i }, s); }).concat(custom);
  }
  function isActive(it) { var s = stats[it.id]; return !!s && s.w > 0 && s.c < 3; }
  function noticeHtml() {
    if (!notice) return '';
    var h = '<div class="note">' + esc(notice) + '</div>';
    notice = '';
    return h;
  }
  function streak() {
    var n = 0, d = new Date();
    if (!days[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function sentHtml(text, fill) {
    var i = text.indexOf('＿');
    var mid = fill ? '<b class="fill">' + esc(fill) + '</b>' : '<span class="gap"></span>';
    return '<span lang="ja">' + (i < 0 ? esc(text) : esc(text.slice(0, i)) + mid + esc(text.slice(i + 1))) + '</span>';
  }

  // ---------- выбор следующего предложения ----------
  function weight(it) {
    var s = stats[it.id];
    if (!s) return 1.5;
    return Math.max(0.25, 1 + s.w * 2 - s.c);
  }
  function pool() {
    var all = allItems();
    if (mode === 'mistakes') {
      var p = all.filter(isActive);
      if (p.length) return p;
      mode = 'all';
      notice = 'Все ошибки отработаны — вернул общий режим.';
    }
    return all;
  }
  function pick() {
    var p = pool();
    var cand = p.length > 1 && cur && cur.item ? p.filter(function (it) { return it.id !== cur.item.id; }) : p;
    var tot = cand.reduce(function (a, it) { return a + weight(it); }, 0), r = Math.random() * tot;
    for (var i = 0; i < cand.length; i++) { r -= weight(cand[i]); if (r <= 0) return cand[i]; }
    return cand[cand.length - 1];
  }
  function next() {
    var item = pick();
    cur = { item: item, done: false, chosen: null, ok: null, showR: settings.reading, msg: '', extra: '', hint: false, goal: false };
    render();
  }

  // FURIGANA-BEGIN
  var KANJI_RE = /[一-鿿々0-9０-９]/;
  function splitTokens(t) {
    var out = [], cur = '', k = null;
    for (var i = 0; i < t.length; i++) {
      var c = t.charAt(i), isK = KANJI_RE.test(c);
      if (k === null || isK === k) cur += c;
      else { out.push({ k: k, s: cur }); cur = c; }
      k = isK;
    }
    if (cur) out.push({ k: k, s: cur });
    return out;
  }
  function furigana(t, r) {
    if (!t || !r) return null;
    var tk = splitTokens(t);
    // Перебор вариантов границ: чтение иероглифов не может быть короче числа иероглифов
    function go(i, j) {
      if (i === tk.length) return j === r.length ? [] : null;
      var x = tk[i], rest;
      if (!x.k) {
        if (r.substr(j, x.s.length) !== x.s) return null;
        rest = go(i + 1, j + x.s.length);
        return rest ? [{ s: x.s }].concat(rest) : null;
      }
      var nxt = tk[i + 1];
      if (!nxt) return r.length - j >= 1 ? [{ s: x.s, k: true, rd: r.slice(j) }] : null;
      var minLen = Math.max(1, x.s.replace(/[0-9０-９]/g, '').length);
      var maxLen = x.s.length * 6 + 3;
      var pos = r.indexOf(nxt.s, j + minLen);
      while (pos >= 0 && pos - j <= maxLen) {
        rest = go(i + 1, pos);
        if (rest) return [{ s: x.s, k: true, rd: r.slice(j, pos) }].concat(rest);
        pos = r.indexOf(nxt.s, pos + 1);
      }
      return null;
    }
    return go(0, 0);
  }
  // FURIGANA-END
  // GRID-BEGIN
  // Рукописная сетка, как бумага для сочинений: один знак — одна клетка.
  // Переносы только между «словами» (иероглифы + окончание), чтобы не рвать слово пополам.
  var OKU = 7;
  function cellHtml(ch) { return '<span class="c">' + esc(ch) + '</span>'; }
  function blankCell(fill) {
    if (!fill) return '<span class="c blank"></span>';
    return '<span class="c fill' + (fill.length > 1 ? ' wide' : '') + '">' + esc(fill) + '</span>';
  }
  function gridHtml(it, fill, wantRuby, wrong) {
    var parts = wantRuby ? furigana(it.t, it.r) : null;
    var ruby = !!parts;
    if (!parts) parts = splitTokens(it.t);
    var units = [], prev = null, last = null;
    parts.forEach(function (p) {
      if (p.k) {
        prev = { rt: ruby && p.rd ? esc(p.rd) : '', cells: Array.from(p.s).map(function (ch) { return cellHtml(ch); }), room: OKU };
        units.push(prev);
        last = prev;
        return;
      }
      Array.from(p.s).forEach(function (ch) {
        if (ch === '＿') {
          last = { rt: wrong ? '<s class="pen">' + esc(wrong) + '</s>' : '', cells: [blankCell(fill)] };
          units.push(last);
          prev = null;
        } else if (/[。、！？]/.test(ch) && last) {
          last.cells.push(cellHtml(ch));
        } else if (prev && prev.room > 0) {
          prev.cells.push(cellHtml(ch));
          prev.room--;
          last = prev;
        } else {
          prev = null;
          last = { rt: '', cells: [cellHtml(ch)] };
          units.push(last);
        }
      });
    });
    var html = units.map(function (u) {
      return '<span class="u">' + (u.rt ? '<span class="rt">' + u.rt + '</span>' : '') + '<span class="cs">' + u.cells.join('') + '</span></span>';
    }).join('');
    return { html: '<div class="grid" lang="ja">' + html + '</div>', ruby: ruby };
  }
  // GRID-END

  // ---------- озвучка ----------
  function speak(text) {
    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
      notice = 'В этом браузере нет озвучки.';
      return;
    }
    try {
      var voices = speechSynthesis.getVoices() || [];
      var ja = voices.filter(function (v) { return /^ja/i.test(v.lang); })[0];
      if (voices.length && !ja) notice = 'Не нашёл японский голос. Добавь его в настройках телефона: Язык → Синтез речи.';
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.85;
      if (ja) u.voice = ja;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function sayCurrent() {
    if (!cur || !cur.done) return;
    var it = cur.item, p = cur.ok ? cur.chosen : it.a[0];
    speak(it.t.replace('＿', p));
  }

  // ---------- ответ ----------
  function answer(p) {
    if (!cur || cur.done) return;
    var it = cur.item, ok = it.a.indexOf(p) >= 0;
    var s = stats[it.id] || (stats[it.id] = { w: 0, c: 0, seen: 0, bad: [] });
    s.seen++;
    if (ok) { if (!cur.hint) s.c++; } else { s.w++; s.c = 0; s.bad = [p].concat(s.bad || []).slice(0, 6); }
    var k = dayKey(), d = days[k] || (days[k] = { n: 0, ok: 0 });
    d.n++; if (ok) d.ok++;
    if (settings.goal && d.n === settings.goal) cur.goal = true;
    cur.done = true; cur.chosen = p; cur.ok = ok; cur.msg = rnd(ok ? MSG_OK : MSG_BAD);
    if (!ok) { try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {} }
    if (ok && cur.hint) {
      cur.extra = 'Верно, но с подсказкой: в прогресс освоения не засчитываю.';
    } else if (ok && s.w > 0) {
      cur.extra = s.c >= 3
        ? 'Это предложение было в дневнике ошибок. Три верных подряд — считаю освоенным.'
        : 'Из дневника ошибок. До «освоено» осталось верных ответов подряд: ' + (3 - s.c) + '.';
    }
    saveAll();
    render();
    if (settings.speak) { sayCurrent(); if (notice) render(); }
  }

  // ---------- экраны ----------
  function renderPractice() {
    var it = cur.item, k = allItems().filter(isActive).length, td = days[dayKey()] || { n: 0, ok: 0 };
    var tn = 0, tok = 0;
    for (var d in days) { tn += days[d].n; tok += days[d].ok; }
    var goal = settings.goal || 0, pct = goal ? Math.min(100, Math.round(td.n / goal * 100)) : 0;
    var h = noticeHtml();
    h += '<div class="meter"><span>Сегодня <b>' + td.n + (goal ? '/' + goal : '') + '</b>' + (goal && td.n >= goal ? '<i class="seal" lang="ja">済</i>' : '') + '</span><span>Серия <b>' + streak() + ' дн.</b></span><span>Точность <b>' + (tn ? Math.round(tok / tn * 100) + '%' : '—') + '</b></span></div>';
    h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="seg"><button data-act="mode" data-m="all"' + (mode === 'all' ? ' class="on"' : '') + '>Все предложения</button><button data-act="mode" data-m="mistakes"' + (mode === 'mistakes' ? ' class="on"' : '') + (k ? '' : ' disabled') + '>Мои ошибки (' + k + ')</button></div>';
    var fill = cur.done ? (cur.ok ? cur.chosen : it.a[0]) : null;
    var g = gridHtml(it, fill, !!(cur.showR && it.r), cur.done && !cur.ok ? cur.chosen : '');
    h += '<section class="sheet">' + g.html;
    if (cur.showR && it.r && !g.ruby) h += '<div class="read">' + sentHtml(it.r, fill) + '</div>';
    h += '<div class="ru">' + esc(it.ru) + '</div><div class="links">';
    if (it.r) h += '<button class="link" data-act="reading">' + (cur.showR ? 'Скрыть фуригану' : 'Показать фуригану') + '</button>';
    if (cur.done) h += '<button class="link" data-act="speak">Послушать</button>';
    else if (!cur.hint) h += '<button class="link" data-act="hint">Подсказка</button>';
    h += '</div></section>';
    if (!cur.done) {
      if (cur.hint) h += '<div class="note">' + esc(RULES[it.a[0]] || '') + '</div>';
      h += '<div class="opts">' + ['は','が','を','に','で','へ','と','も','の','や','か','から','まで'].map(function (p) {
        return '<button class="key' + (p.length > 1 || p === 'か' ? ' w2' : '') + '" lang="ja" data-act="ans" data-p="' + p + '">' + p + '</button>';
      }).join('') + '</div>';
    } else {
      var rules = it.a.map(function (p) { return '<b lang="ja">' + esc(p) + '</b> — ' + esc(RULES[p] || ''); }).join('<br>');
      h += '<div class="res ' + (cur.ok ? 'ok' : 'no') + '"><div class="verdict">' + esc(cur.msg) + '</div>';
      if (!cur.ok) h += '<div>Ты выбрал <b lang="ja">' + esc(cur.chosen) + '</b>, а здесь нужно <b lang="ja">' + esc(it.a.join(' или ')) + '</b>.</div><div class="small">Ошибка записана в дневник.</div>';
      else if (it.a.length > 1) h += '<div class="small">Здесь подходят: ' + esc(it.a.join(', ')) + '.</div>';
      h += '<div class="rule">' + rules + '</div>';
      if (it.n) h += '<div class="small">' + esc(it.n) + '</div>';
      if (cur.extra) h += '<div class="small">' + esc(cur.extra) + '</div>';
      if (cur.goal) h += '<div class="goalmsg"><i class="seal" lang="ja" style="margin:0 6px 0 0">済</i>Цель на сегодня выполнена: ' + settings.goal + ' ответов. Можно остановиться или продолжить.</div>';
      h += '<button class="primary" data-act="next">Дальше</button></div>';
    }
    return h;
  }

  function rowHtml(it) {
    var s = stats[it.id];
    return '<div class="item"><div class="sent sm">' + sentHtml(it.t, it.a[0]) + '</div><div class="small">' + esc(it.ru) + '</div><div class="small">Ошибок: <b>' + s.w + '</b> · твои ответы: ' + esc(uniq(s.bad || []).join(', ')) + '</div></div>';
  }
  function renderDiary() {
    var h = noticeHtml() + '<h2>Дневник ошибок</h2>';
    var rows = allItems().filter(function (it) { return stats[it.id] && stats[it.id].w > 0; });
    if (!rows.length) return h + '<div class="card small">Пока пусто. Ошибки появятся здесь сами, вносить ничего не нужно.</div>';
    var act = rows.filter(isActive).sort(function (a, b) { return stats[b.id].w - stats[a.id].w; });
    var done = rows.filter(function (it) { return !isActive(it); });
    var byP = {};
    rows.forEach(function (it) { var p = it.a[0]; byP[p] = (byP[p] || 0) + stats[it.id].w; });
    var top = Object.keys(byP).sort(function (a, b) { return byP[b] - byP[a]; }).slice(0, 4);
    h += '<div class="card"><div class="small">Чаще всего ошибаешься на:</div><div class="chips">' +
      top.map(function (p) { return '<span class="chip"><b>' + esc(p) + '</b> ×' + byP[p] + '</span>'; }).join('') +
      '</div><button class="primary" data-act="train"' + (act.length ? '' : ' disabled') + '>Тренировать ошибки (' + act.length + ')</button></div>';
    if (act.length) h += '<h3>В работе</h3><div class="card">' + act.map(rowHtml).join('') + '</div>';
    if (done.length) h += '<h3>Освоено (3 верных подряд)</h3><div class="card">' + done.map(rowHtml).join('') + '</div>';
    return h;
  }

  function renderAdd() {
    var opts = PARTS.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('');
    var h = noticeHtml() + '<h2>Своё предложение</h2><div class="card">';
    h += '<label>Предложение (на месте частицы поставь ＿ или _)</label><textarea id="f-t" rows="2"></textarea>';
    h += '<label>Чтение хираганой (необязательно, тоже с ＿)</label><textarea id="f-r" rows="2"></textarea>';
    h += '<div class="row"><div><label>Правильная частица</label><select id="f-a1">' + opts + '</select></div><div><label>Или ещё подходит</label><select id="f-a2"><option value="">—</option>' + opts + '</select></div></div>';
    h += '<label>Перевод или смысл (чтобы не было двусмысленности)</label><input type="text" id="f-ru">';
    h += '<div class="small" id="f-msg"></div><button class="primary" data-act="add">Добавить</button></div>';
    h += '<h3>Мои предложения (' + custom.length + ')</h3>';
    if (!custom.length) h += '<div class="card small">Пока нет. Добавляй фразы из учебника, песен или аниме.</div>';
    else h += '<div class="card">' + custom.map(function (it) {
      return '<div class="item"><div class="sent sm">' + sentHtml(it.t, it.a[0]) + '</div><div class="small">' + esc(it.ru) + '</div><button class="link" data-act="delc" data-id="' + esc(it.id) + '">Удалить</button></div>';
    }).join('') + '</div>';
    return h;
  }

  function renderMore() {
    var h = noticeHtml() + '<h2>Ещё</h2>';
    h += '<div class="card"><div class="sw"><span>Всегда показывать фуригану</span><button class="tog' + (settings.reading ? ' on' : '') + '" data-act="defread">' + (settings.reading ? 'Вкл' : 'Выкл') + '</button></div></div>';
    h += '<div class="card"><div style="margin-bottom:10px">Цель на день (ответов)</div><div class="seg" style="margin-bottom:0">' + [5, 10, 20, 30].map(function (n) { return '<button data-act="goal" data-n="' + n + '"' + (settings.goal === n ? ' class="on"' : '') + '>' + n + '</button>'; }).join('') + '</div></div>';
    h += '<div class="card"><div class="sw"><span>Озвучивать предложение после ответа</span><button class="tog' + (settings.speak ? ' on' : '') + '" data-act="defspeak">' + (settings.speak ? 'Вкл' : 'Выкл') + '</button></div></div>';
    h += '<div class="card"><h3>Резервная копия</h3><div class="small">Ошибки, свои предложения и серия хранятся только в этом браузере. Если очистить данные Chrome, всё пропадёт, поэтому иногда сохраняй копию.</div>';
    h += '<button class="primary" data-act="export">Сохранить копию (файл)</button>';
    h += '<button class="ghost" data-act="import">Загрузить копию</button><input type="file" id="imp" accept="application/json,.json" style="display:none"><div class="small">Загрузка заменит текущие данные.</div></div>';
    h += '<div class="card"><h3>Сброс</h3><button class="danger" data-act="reset" style="margin-top:0">' + (resetArmed ? 'Точно сбросить? Нажми ещё раз' : 'Сбросить прогресс и ошибки') + '</button><div class="small">Свои предложения останутся.</div></div>';
    h += '<div class="card small">Чтобы поставить на экран: меню Chrome ⋮ → «Установить приложение» или «Добавить на главный экран». После этого работает и без интернета.</div>';
    return h;
  }

  function render() {
    var tabs = document.querySelectorAll('#tabs button');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('on', tabs[i].dataset.tab === tab);
    var h = tab === 'practice' ? renderPractice() : tab === 'diary' ? renderDiary() : tab === 'add' ? renderAdd() : renderMore();
    $app.innerHTML = h;
  }

  // ---------- действия ----------
  function addSentence() {
    var g = function (id) { return document.getElementById(id); };
    var msg = g('f-msg');
    var norm = function (s) { return s.replace(/[_＿]+/g, '＿').trim(); };
    var cnt = function (s) { return (s.match(/＿/g) || []).length; };
    var t = norm(g('f-t').value), r = norm(g('f-r').value), ru = g('f-ru').value.trim();
    var a = uniq([g('f-a1').value, g('f-a2').value].filter(Boolean));
    if (cnt(t) !== 1) { msg.textContent = 'В предложении должно быть ровно одно пропущенное место ＿.'; return; }
    if (r && cnt(r) !== 1) { msg.textContent = 'В чтении тоже нужен ровно один знак ＿.'; return; }
    if (!ru) { msg.textContent = 'Напиши перевод или смысл: по нему видно, какая частица нужна.'; return; }
    custom.push({ id: 'c' + Date.now(), t: t, r: r, a: a, ru: ru });
    saveAll();
    notice = 'Добавлено, оно уже в общей очереди.';
    render();
  }
  function delCustom(id) {
    custom = custom.filter(function (it) { return it.id !== id; });
    delete stats[id];
    saveAll();
    if (cur && cur.item.id === id) { cur = null; next(); } else render();
  }
  function exportData() {
    var data = JSON.stringify({ v: 1, stats: stats, custom: custom, days: days, settings: settings });
    var blob = new Blob([data], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'particles-backup-' + dayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    notice = 'Файл копии сохранён (папка «Загрузки»).';
    render();
  }
  function validCustom(c) {
    return c && typeof c.id === 'string' && typeof c.t === 'string' && typeof c.ru === 'string' &&
      Array.isArray(c.a) && c.a.length > 0 && c.a.every(function (p) { return PARTS.indexOf(p) >= 0; });
  }
  function importData(txt) {
    var d;
    try { d = JSON.parse(txt); } catch (e) { return 'Это не похоже на файл копии.'; }
    if (!d || typeof d !== 'object' || typeof d.stats !== 'object') return 'В файле нет данных прогресса.';
    stats = d.stats || {};
    custom = Array.isArray(d.custom) ? d.custom.filter(validCustom) : [];
    days = d.days && typeof d.days === 'object' ? d.days : {};
    settings = Object.assign({ reading: false, speak: false, goal: 10 }, d.settings || {});
    saveAll();
    return null;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; resetArmed = false; render(); window.scrollTo(0, 0); return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'ans') answer(el.dataset.p);
    else if (act === 'next') { next(); window.scrollTo(0, 0); }
    else if (act === 'reading') { cur.showR = !cur.showR; render(); }
    else if (act === 'mode') { mode = el.dataset.m; cur = null; next(); }
    else if (act === 'train') { mode = 'mistakes'; tab = 'practice'; cur = null; next(); window.scrollTo(0, 0); }
    else if (act === 'add') addSentence();
    else if (act === 'delc') delCustom(el.dataset.id);
    else if (act === 'export') exportData();
    else if (act === 'import') { var inp = document.getElementById('imp'); if (inp) inp.click(); }
    else if (act === 'defread') { settings.reading = !settings.reading; if (cur) cur.showR = settings.reading; saveAll(); render(); }
    else if (act === 'hint') { if (cur && !cur.done) { cur.hint = true; render(); } }
    else if (act === 'goal') { settings.goal = +el.dataset.n; saveAll(); render(); }
    else if (act === 'speak') { sayCurrent(); if (notice) render(); }
    else if (act === 'defspeak') { settings.speak = !settings.speak; saveAll(); render(); }
    else if (act === 'reset') {
      if (!resetArmed) { resetArmed = true; render(); }
      else { stats = {}; days = {}; resetArmed = false; saveAll(); notice = 'Прогресс и дневник ошибок сброшены.'; cur = null; next(); }
    }
  });

  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'imp') return;
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var err = importData(String(rd.result));
      notice = err ? err : 'Данные загружены.';
      tab = 'more'; cur = null; next();
    };
    rd.readAsText(f);
  });

  try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch (e) {}
  next();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
